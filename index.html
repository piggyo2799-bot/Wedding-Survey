<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>婚禮任務｜加穎 & 姵妤</title>
  <style>
    body {
      background: #f3efe2;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      width: 360px;
      background: #fff6dc;
      border: 4px solid #5a4632;
      padding: 20px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      padding: 6px 12px;
      font-family: inherit;
      cursor: pointer;
    }
    input, textarea {
      width: 100%;
      margin-top: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="box" id="app"></div>

  <script>
    let step = 0;
    let data = {};

    window.onload = function () {
      render();
    };

    function render() {
      const app = document.getElementById("app");

      if (step === 0) {
        app.innerHTML = `
          <p>👤 村長：冒險者，是否接受參加<br>「加穎 & 姵妤」的婚禮任務？</p>
          <button onclick="next()">接受任務</button>
        `;
      }

      else if (step === 1) {
        app.innerHTML = `
          <p>📝 請輸入你的名字：</p>
          <input id="name" placeholder="你的名字" />
          <button onclick="saveName()">下一步</button>
        `;
      }

      else if (step === 2) {
        app.innerHTML = `
          <p>📅 是否出席婚禮？</p>
          <button onclick="saveAttend('出席')">出席</button>
          <button onclick="saveAttend('不克出席')">不克出席</button>
        `;
      }

      else if (step === 3) {
        app.innerHTML = `
          <p>⏰ 你將參加哪一個場次？</p>
          <button onclick="saveSession('早上迎娶')">早上迎娶</button>
          <button onclick="saveSession('中午宴客')">中午宴客</button>
        `;
      }

      else if (step === 4) {
        app.innerHTML = `
          <p>💬 有沒有想對新人說的話？</p>
          <textarea id="note" rows="3"></textarea>
          <button onclick="finish()">完成任務</button>
        `;
      }

      else if (step === 5) {
        app.innerHTML = `
          <p>🎉 任務完成！</p>
          <p>感謝你接受婚禮任務</p>
          <p>EXP +100 ✨</p>
        `;
      }
    }

    function next() {
      step++;
      render();
    }

    function saveName() {
      const v = document.getElementById("name").value;
      if (!v) return alert("請輸入名字");
      data.name = v;
      next();
    }

    function saveAttend(v) {
      data.attend = v;
      next();
    }

    function saveSession(v) {
      data.session = v;
      next();
    }

    function finish() {
      data.note = document.getElementById("note").value;
      next();
    }
  </script>

</body>
</html>
