<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>婚禮任務｜加穎 & 姵妤</title>
<style>
body {
  background:#f3efe2;
  font-family: "Courier New", monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box {
  width:360px;
  background:#fff6dc;
  border:4px solid #5a4632;
  padding:20px;
}
button {
  margin-top:15px;
  padding:8px 16px;
  background:#e6d3a3;
  border:2px solid #5a4632;
  cursor:pointer;
}
input, textarea {
  width:100%;
  margin-top:8px;
}
</style>
</head>
<body>

<div class="box" id="app"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxyEofmn5zwVChV8ppkPiLKb9aS8-tGLAIFOcZ0S19jRITxv5A5bEfWXeOV1p5aNHU4TQ/exec";
  
let step = 0;
let data = {};

render();

function render() {
  const app = document.getElementById("app");

  if (step === 0) {
    app.innerHTML = `
      🧙‍♂️ 村長：冒險者，是否接受參加「加穎 & 姵妤」的婚禮任務？<br>
      <button onclick="next()">接受任務</button>
    `;
  }

  if (step === 1) {
    app.innerHTML = `
      請輸入你的大名：<br>
      <input id="name"><br>
      <button onclick="saveName()">下一句對話</button>
    `;
  }

  if (step === 2) {
    app.innerHTML = `
      是否能出席婚禮？<br>
      <button onclick="saveAttend('會出席')">我一定會到</button>
      <button onclick="saveAttend('無法出席')">無法出席</button>
    `;
  }

  if (step === 3) {
    app.innerHTML = `
      出席場次為？<br>
      <button onclick="saveSession('迎娶')">迎娶（上午）</button>
      <button onclick="saveSession('午宴')">午宴</button>
      <button onclick="saveSession('迎娶＋午宴')">都出席</button>
    `;
  }

  if (step === 4) {
    app.innerHTML = `
      有想對新人說的話嗎？<br>
      <textarea id="note"></textarea><br>
      <button onclick="finish()">完成任務</button>
    `;
  }

  if (step === 5) {
    app.innerHTML = `
      🎉 任務完成！<br><br>
      感謝冒險者 <b>${data.name}</b><br>
      婚禮當天見 💍🍁<br><br>
      🏆 成就解鎖：<br>
      《見證幸福的一刻》 EXP +100
    `;
  }
}

function next() {
  step++;
  render();
}

function saveName() {
  data.name = document.getElementById("name").value;
  next();
}

function saveAttend(v) {
  data.attend = v;
  next();
}

function saveSession(v) {
  data.session = v;
  next();
}

function finish() {
  data.note = document.getElementById("note").value;
  next();
}
</script>

</body>
</html>
