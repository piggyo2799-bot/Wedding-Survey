<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>婚禮冒險｜加穎 & 姵妤</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background:
      radial-gradient(circle at top, rgba(255,255,255,0.5), transparent 60%),
      linear-gradient(#8fd19e, #5aa469);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Courier New", monospace;
  }

  .book {
    background: #f7f0dc;
    border: 10px solid #c8b38a;
    box-shadow: 0 0 0 4px #fff, 8px 8px 0 rgba(0,0,0,0.25);
    width: 380px;
    padding: 18px;
  }

  .screen {
    background: linear-gradient(#dff3e3, #b7ddb0);
    border: 4px solid #6b4f2a;
    padding: 16px;
    min-height: 260px;
  }

  h2 {
    margin: 0 0 10px;
    text-align: center;
    color: #5a3d1e;
  }

  p {
    font-size: 14px;
    margin: 6px 0;
  }

  .login {
    text-align: center;
    margin-top: 20px;
  }

  input, textarea {
    width: 100%;
    padding: 6px;
    font-family: inherit;
    border: 2px solid #6b4f2a;
    background: #fffdf5;
    margin-top: 6px;
    box-sizing: border-box;
  }

  button {
    margin-top: 10px;
    padding: 6px 16px;
    font-family: inherit;
    font-size: 14px;
    background: linear-gradient(#f9e29c, #e3b95b);
    border: 2px solid #6b4f2a;
    box-shadow: 2px 2px 0 #bfa76a;
    cursor: pointer;
  }

  button:active {
    transform: translate(1px,1px);
    box-shadow: 1px 1px 0 #bfa76a;
  }

  .npc {
    font-weight: bold;
    color: #5a3d1e;
  }

  .music {
    text-align: right;
    font-size: 12px;
    cursor: pointer;
    color: #5a3d1e;
  }

  .quest {
    background: #fff;
    border: 2px dashed #6b4f2a;
    padding: 6px;
    margin-bottom: 8px;
    font-size: 13px;
  }
</style>
</head>

<body>
<div class="book">
  <div class="music" onclick="toggleMusic()">🎵 音樂 開 / 關</div>
  <div class="screen" id="app"></div>
</div>

<audio id="bgm" loop>
  <!-- 免費、合法、楓之谷感的背景音樂 -->
  <source src="https://cdn.pixabay.com/audio/2022/10/18/audio_8a3f2c5f6c.mp3" type="audio/mpeg">
</audio>

<script>
let step = 0;
let data = {};

function toggleMusic() {
  const bgm = document.getElementById("bgm");
  bgm.paused ? bgm.play() : bgm.pause();
}

window.onload = () => render();

function render() {
  const app = document.getElementById("app");

  if (step === 0) {
    app.innerHTML = `
      <h2>🍁 婚禮冒險 🍁</h2>
      <div class="login">
        <p>請輸入冒險者名稱</p>
        <input id="name" placeholder="角色名稱" />
        <button onclick="saveName()">開始冒險</button>
      </div>
    `;
  }

  else if (step === 1) {
    app.innerHTML = `
      <div class="quest">📜 任務：回覆婚禮出席意願</div>
      <p class="npc">👤 村長：</p>
      <p>你是否能出席婚禮呢？</p>
      <button onclick="saveAttend('出席')">我會出席</button>
      <button onclick="saveAttend('不克出席')">不克出席</button>
    `;
  }

  else if (step === 2) {
    app.innerHTML = `
      <p class="npc">👤 村長：</p>
      <p>你將參加哪一個場次？</p>
      <button onclick="saveSession('早上迎娶')">早上迎娶</button>
      <button onclick="saveSession('中午宴客')">中午宴客</button>
      <button onclick="saveSession('迎娶＋宴客')">兩者皆參加</button>
    `;
  }

  else if (step === 3) {
    app.innerHTML = `
      <p class="npc">👤 村長：</p>
      <p>有沒有想對新人說的話？</p>
      <textarea id="note" rows="3"></textarea>
      <button onclick="finish()">完成任務</button>
    `;
  }

  else if (step === 4) {
    app.innerHTML = `
      <p class="npc">✨ 任務完成 ✨</p>
      <p>新人已收到你的回覆<br>感到非常開心！</p>
      <p><strong>EXP +100<br>好感度 +10 💛</strong></p>
    `;
  }
}

function saveName() {
  const v = document.getElementById("name").value;
  if (!v) return alert("請輸入名字");
  data.name = v;
  step++;
  render();
}

function saveAttend(v) {
  data.attend = v;
  step++;
  render();
}

function saveSession(v) {
  data.session = v;
  step++;
  render();
}

function finish() {
  data.note = document.getElementById("note").value;
  step++;
  render();
}
</script>
</body>
</html>
