<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>婚禮任務｜加穎 & 姵妤</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(#b9d3a7, #7fa07a);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Courier New", monospace;
  }

  .frame {
    background: #f4ecd6;
    border: 8px solid #9c8354;
    box-shadow: 0 0 0 4px #fff, 6px 6px 0 rgba(0,0,0,0.35);
    width: 390px;
    padding: 14px;
  }

  .music-hint {
    background: #fff;
    border: 2px solid #6b5a3a;
    padding: 6px;
    margin-bottom: 6px;
    font-size: 13px;
    text-align: center;
  }

  .window {
    background: #fff8e6;
    border: 4px solid #6b5a3a;
    padding: 14px;
    min-height: 280px;
  }

  p {
    font-size: 14px;
    margin: 6px 0;
    line-height: 1.6;
    color: #3e3e3e;
  }

  .npc {
    font-weight: bold;
    color: #5a3d1e;
  }

  .quest {
    background: #fff;
    border: 2px dashed #6b5a3a;
    padding: 6px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .exp {
    color: #a36a00;
    font-weight: bold;
  }

  input, textarea {
    width: 100%;
    padding: 6px;
    font-family: inherit;
    border: 2px solid #6b5a3a;
    background: #fffdf5;
    margin-top: 6px;
    box-sizing: border-box;
  }

  button {
    margin-top: 8px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 14px;
    background: linear-gradient(#f6dc9a, #d2b26a);
    border: 2px solid #6b5a3a;
    box-shadow: 2px 2px 0 #bfa76a;
    cursor: pointer;
  }

  button:active {
    transform: translate(1px,1px);
    box-shadow: 1px 1px 0 #bfa76a;
  }

  .emoji-bar {
    text-align: center;
    font-size: 22px;
    margin-bottom: 6px;
  }

  .pixel-img {
    display: block;
    margin: 6px auto;
    width: 120px;
    image-rendering: pixelated;
  }
</style>
</head>

<body>
<div class="frame">

  <!-- 🎵 音樂提示 -->
  <div id="musicHint" class="music-hint">
    🔊 建議開啟背景音樂，體驗完整冒險感<br>
    <button onclick="enableMusic()">開啟音樂</button>
  </div>

  <div class="window" id="app"></div>
</div>

<!-- 🎵 音樂（合法素材） -->
<audio id="music-login" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5c31e4d1c4.mp3">
</audio>
<audio id="music-quest" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/18/audio_8a3f2c5f6c.mp3">
</audio>
<audio id="music-finish">
  <source src="https://cdn.pixabay.com/audio/2022/03/09/audio_1c3d44e7c2.mp3">
</audio>

<script>
let step = 0;
let data = {};
let musicEnabled = false;

window.onload = () => render();

/* ===== 音樂 ===== */
function stopAllMusic() {
  ["music-login","music-quest","music-finish"].forEach(id => {
    const m = document.getElementById(id);
    m.pause(); m.currentTime = 0;
  });
}

function enableMusic() {
  musicEnabled = true;
  document.getElementById("musicHint").style.display = "none";
  playQuestMusic();
}

function playQuestMusic() {
  if (!musicEnabled) return;
  stopAllMusic();
  const m = document.getElementById("music-quest");
  m.volume = 0.35; m.play();
}

function playFinishMusic() {
  if (!musicEnabled) return;
  stopAllMusic();
  const m = document.getElementById("music-finish");
  m.volume = 0.5; m.play();
}

/* ===== SVG 公告牌 ===== */
function noticeBoard() {
  return `
  <div style="text-align:center; margin-bottom:6px;">
    <svg width="120" height="80" viewBox="0 0 120 80">
      <rect x="10" y="10" width="100" height="50" rx="6"
        fill="#f6dc9a" stroke="#6b5a3a" stroke-width="4"/>
      <text x="60" y="42" text-anchor="middle"
        font-size="14" fill="#5a3d1e">任務公告</text>
      <rect x="55" y="60" width="10" height="18"
        fill="#6b5a3a"/>
    </svg>
  </div>`;
}

/* ===== 畫面流程 ===== */
function render() {
  const app = document.getElementById("app");

  if (step === 0) {
    app.innerHTML = `
      ${noticeBoard()}
      <div class="emoji-bar">🌳 🍁 🍄</div>
      <p class="npc">👤 村長：</p>
      <p>
        冒險者啊……<br>
        你是否願意接受<br>
        「加穎 & 姵妤」的婚禮任務？
      </p>
      <button onclick="step=1;render()">接受任務</button>
      <button onclick="decline()">暫不接受</button>
    `;
  }

  else if (step === 1) {
    app.innerHTML = `
      <div class="quest">📜 任務：回覆婚禮出席意願</div>
      <img class="pixel-img"
        src="https://opengameart.org/sites/default/files/tree_0.png">
      <p class="npc">👤 村長：</p>
      <p>先告訴我你的名字吧。</p>
      <input id="name" placeholder="冒險者名稱">
      <button onclick="saveName()">確定</button>
    `;
  }

  else if (step === 2) {
    playQuestMusic();
    app.innerHTML = `
      <div class="emoji-bar">🍄 🍄</div>
      <p class="npc">👤 村長：</p>
      <p>你是否能出席婚禮呢？</p>
      <button onclick="saveAttend('出席')">我會出席</button>
      <button onclick="saveAttend('不克出席')">不克出席</button>
    `;
  }

  else if (step === 3) {
    app.innerHTML = `
      <p class="npc">👤 村長：</p>
      <p>你將參加哪一個場次？</p>
      <button onclick="saveSession('早上迎娶')">早上迎娶</button>
      <button onclick="saveSession('中午宴客')">中午宴客</button>
      <button onclick="saveSession('迎娶＋宴客')">兩者皆參加</button>
    `;
  }

  else if (step === 4) {
    app.innerHTML = `
      <p class="npc">👤 村長：</p>
      <p>有沒有想對新人說的話？</p>
      <textarea id="note" rows="3"></textarea>
      <button onclick="finish()">完成任務</button>
    `;
  }

  else if (step === 5) {
    playFinishMusic();
    app.innerHTML = `
      <div class="emoji-bar">✨ 🎉 ✨</div>
      <p class="npc">✨ 任務完成 ✨</p>
      <p>新人已收到你的回覆<br>感到非常開心！</p>
      <p class="exp">EXP +1314<br>名聲 +520 💛</p>
    `;
  }
}

function decline() {
  document.getElementById("app").innerHTML = `
    <p class="npc">👤 村長：</p>
    <p>沒關係的冒險者，<br>隨時歡迎回來。</p>
  `;
}

function saveName() {
  const v = document.getElementById("name").value;
  if (!v) return alert("請輸入名字");
  data.name = v;
  step++; render();
}

function saveAttend(v) { data.attend = v; step++; render(); }
function saveSession(v) { data.session = v; step++; render(); }
function finish() { data.note = document.getElementById("note").value; step++; render(); }
</script>
</body>
</html>
